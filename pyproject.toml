[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-report-hwpx"
version = "0.5.6"
description = "Korean government documents MCP server — turns a draft into a ministry-format report (개조식 보고서), press release (보도자료) or official draft (기안문) as HWPX (Hangul). 7 tools, runs locally. 공무원 공문서 HWPX 생성 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Upstage" }]
dependencies = ["mcp>=2.2", "uvicorn>=0.30"]
keywords = ["mcp", "mcp-server", "korea", "korean", "hwpx", "hwp", "hangul", "hancom", "government", "korean-government", "official-document", "official-draft", "document-generation", "report", "press-release", "공문서", "보고서", "보도자료", "기안문", "한글"]

[project.urls]
Homepage = "https://upstageai.github.io/korean-tax-mcp/"
Repository = "https://github.com/UpstageAI/korean-report-hwpx"
Documentation = "https://github.com/UpstageAI/korean-report-hwpx/blob/main/README-EN.md"
Changelog = "https://github.com/UpstageAI/korean-report-hwpx/blob/main/CHANGELOG.md"

[project.scripts]
korean-report-hwpx = "korean_report_hwpx.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "lxml>=5"]

[tool.hatch.build.targets.wheel]
packages = ["korean_report_hwpx"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "dist", ".venv", "out_check", "out_check_report"]
