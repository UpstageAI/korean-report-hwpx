[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-gov-docs"
version = "0.1.0"
description = "Korean government documents MCP server — turns a draft into a ministry-format report (개조식 보고서) or press release (보도자료) as HWPX (Hangul). 공무원 공문서 HWPX 생성 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Upstage" }]
dependencies = ["mcp>=2.2", "uvicorn>=0.30"]
keywords = ["mcp", "mcp-server", "korea", "hwpx", "hwp", "hangul", "government", "report", "press-release", "solar", "공문서", "보고서", "보도자료", "한글"]

[project.urls]
Repository = "https://github.com/UpstageAI/korean-gov-docs"

[project.scripts]
korean-gov-docs = "korean_gov_docs.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "lxml>=5"]

[tool.hatch.build.targets.wheel]
packages = ["korean_gov_docs"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "dist", ".venv", "out_check", "out_check_report"]
