[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "press-release-hwpx"
version = "0.1.0"
description = "Korean government press release formatter MCP server — builds ministry-style HWPX (Hangul) files from rules. 정부 보도자료 서식 HWPX 생성 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Upstage" }]
dependencies = ["mcp>=2.2", "uvicorn>=0.30"]
keywords = ["mcp", "mcp-server", "korea", "hwpx", "hwp", "hangul", "press-release", "government", "보도자료", "한글", "공문서"]

[project.urls]
Repository = "https://github.com/UpstageAI/press-release-hwpx"

[project.scripts]
press-release-hwpx = "press_release_hwpx.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "lxml>=5"]

[tool.hatch.build.targets.wheel]
packages = ["press_release_hwpx"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "dist", ".venv"]
